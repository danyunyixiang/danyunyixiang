<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <script>
    class Axios {
      constructor(config = {}) {
        this.defaults = config;
      }

      // 处理完整URL
      getFullUrl(url) {
        const { baseURL } = this.defaults;
        if (baseURL && !url.startsWith('http')) {
          return baseURL.replace(/\/$/, '') + '/' + url.replace(/^\//, '');
        }
        return url;
      }

      // 序列化参数
      serializeParams(params) {
        return Object.keys(params || {})
          .map(
            (k) => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])
          )
          .join('&');
      }

      // 核心请求方法
      request(config) {
        return new Promise((resolve, reject) => {
          const { method = 'GET', url, params, data, headers } = config;
          const xhr = new XMLHttpRequest();

          // 处理URL和查询参数
          const fullUrl = this.getFullUrl(url);
          const queryString = this.serializeParams(params);
          const finalUrl = [fullUrl, queryString].filter(Boolean).join('?');

          xhr.open(method.toUpperCase(), finalUrl, true);

          // 设置请求头
          if (headers) {
            Object.keys(headers).forEach((key) => {
              xhr.setRequestHeader(key, headers[key]);
            });
          }

          // 处理响应
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
              try {
                const response = JSON.parse(xhr.responseText);
                resolve(response);
              } catch (e) {
                resolve(xhr.responseText);
              }
            } else {
              reject(new Error(`HTTP error! status: ${xhr.status}`));
            }
          };

          // 处理错误
          xhr.onerror = () => reject(new Error('Network Error'));
          xhr.ontimeout = () => reject(new Error('Request timeout'));

          // 发送数据
          const sendData = data ? JSON.stringify(data) : null;
          xhr.send(sendData);
        });
      }

      // GET方法
      get(url, config = {}) {
        return this.request({ ...config, method: 'GET', url });
      }

      // POST方法
      post(url, data = {}, config = {}) {
        return this.request({ ...config, method: 'POST', url, data });
      }
    }

    // 创建实例的工厂函数
    const createInstance = (config) => {
      const instance = new Axios(config);
      return instance;
    };

    // 默认实例
    const myAxios = createInstance();

    // 暴露创建实例的方法
    myAxios.create = createInstance;

    export default myAxios;

    // 创建实例
    const apiClient = myAxios.create({
      baseURL: 'https://api.example.com/v1',
      timeout: 5000,
    });

    // GET请求
    apiClient
      .get('/users', {
        params: { page: 1 },
        headers: { Authorization: 'Bearer token' },
      })
      .then((data) => console.log('GET response:', data))
      .catch((err) => console.error('GET error:', err));

    // POST请求
    apiClient
      .post('/login', {
        username: 'user123',
        password: 'pass123',
      })
      .then((data) => console.log('POST response:', data))
      .catch((err) => console.error('POST error:', err));
  </script>
  <body>
    <style>
      body {
        margin: unset;
        display: grid;
        place-content: center;
        height: 100vh;
        background-color: #282c34;
      }
    </style>
    <svg width="400" height="200">
      <defs>
        <pattern
          id="gridUnit"
          x="0"
          y="0"
          width="5"
          height="5"
          patternUnits="userSpaceOnUse"
        >
          <path
            d="M 0 5 L 0 0 5 0"
            stroke="rgba(0, 0, 0, 0.1)"
            stroke-width="1"
            fill="none"
          ></path>
        </pattern>
        <pattern
          id="grid"
          x="0"
          y="0"
          width="25"
          height="25"
          patternUnits="userSpaceOnUse"
        >
          <rect width="25" height="25" x="0" y="0" fill="url(#gridUnit)"></rect>
          <path
            d="M 0 25 L 0 0 25 0"
            stroke="rgba(0, 0, 0, 0.2)"
            stroke-width="1"
            fill="none"
          ></path>
        </pattern>
        <g id="box">
          <path
            id="boxPath"
            fill="transparent"
            d="M 395 195 L 15 195 L 5 185 L 5 10 L 10 5 h 30 L 45 10 L 385 10 L 395 20 Z"
          ></path>
          <line
            stroke-width="3"
            stroke-linecap="round"
            stroke-dasharray="6,4"
            x1="12"
            y1="10"
            x2="38"
            y2="10"
          ></line>
        </g>
        <radialGradient id="radialGradient" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#fff" stop-opacity="1"></stop>
          <stop offset="1" stop-color="#fff" stop-opacity="0"></stop>
        </radialGradient>
        <mask id="mask">
          <circle cx="0" cy="0" r="150" fill="url(#radialGradient)">
            <animateMotion dur="4s" repeatCount="indefinite" rotate="auto">
              <mpath xlink:href="#boxPath"></mpath>
            </animateMotion>
          </circle>
        </mask>
      </defs>
      <rect
        stroke="#aaa"
        width="400"
        height="200"
        x="0"
        y="0"
        fill="url(#grid)"
      ></rect>
      <use stroke="#235fa7" stroke-width="1" xlink:href="#box"></use>
      <use
        stroke="#4fd2dd"
        stroke-linecap="round"
        stroke-width="3"
        xlink:href="#box"
        mask="url(#mask)"
      >
        <animate
          attributeName="stroke-dasharray"
          from="0,1143"
          to="1143,0"
          dur="4s"
          repeatCount="indefinite"
        ></animate>
      </use>
    </svg>
  </body>
</html>
