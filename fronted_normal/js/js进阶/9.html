    // 指拷贝对象的引用地址，而不是拷贝对象的值
    // 拷贝对象，拷贝数组


    // 浅拷贝是按位拷贝对象，它会创建一个新对象，这个对象有着原始对象属性值的一份精确拷贝。
    // 如果属性是基本类型，拷贝的就是基本类型的值；如果属性是内存地址（引用类型），拷贝的就是内存地址 ，
    // 因此如果其中一个对象改变了这个地址，就会影响到另一个对象。

    // 与直接赋值的区别
    // 直接赋值是直接将对象的引用地址赋值给新的对象，所以会影响到原对象
    // 浅拷贝是创建一个新对象，这个对象有着原始对象属性值的一份精确拷贝，但是对于对象内的引用类型，拷贝的是内存地址

    const obj = {
        name: '胡阌祺',
        age: 18,
        info: {
            city: '河南'
        }
    }
    const obj2 = {}
    Object.assign(obj2, obj)
    obj2.name = '胡阌祺2'
    obj2.info.city = '上海'  // 浅拷贝，拷贝的是引用地址，所以会影响到obj
    console.log(obj) //胡阌祺,上海
    console.log(obj2) //胡阌祺2,上海

const deepClone = (obj) => {
    // 非对象类型（包括基本类型、null、函数）直接返回原值
    if (typeof obj !== 'object' || obj === null) {
        return obj
    }

    // 处理数组和对象，仅遍历自身可枚举属性
    const newObj = Array.isArray(obj) ? [] : {}
    for (let key in obj) {
        if (obj.hasOwnProperty(key)) {
            // 递归深拷贝，无法处理循环引用和特殊对象（如Date/RegExp）
            newObj[key] = deepClone(obj[key])
        }
    }
    return newObj
}
