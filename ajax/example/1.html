<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>axios</title>
</head>

<!-- nodemon热更新 -->
<!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"> -->
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --main-bg-color: rgba(237, 130, 239, 0.15);
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }

  #show,
  #bd {
    width: 600px;
    height: 420px;
    margin: 10px;
    background: #eee;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .add,
  .login {
    width: 400px;
    height: 180px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: var(--main-bg-color);
    border-radius: 10px;
    margin: 10px;
    position: relative;
  }

  .add h3,
  .login h3 {
    color: violet;
    margin: 10px;
  }

  #bd input {
    width: 200px;
    height: 30px;
    margin: 10px;
    border: none;
    border: 1px solid violet;
    outline: none;
    text-align: center;
  }

  #bd button {
    width: 100px;
    height: 30px;
    margin: 10px;
    border: none;
    border-radius: 5px;
  }

  .result {
    position: absolute;
    top: 5px;
    left: 5px;
    content: '';
    width: 120px;
    height: 20px;
    line-height: 20px;
    border-radius: 5px;
    text-align: center;
  }

  #show .content {
    height: 360px;
    width: 540px;
    padding: 10px;
    background-color: var(--main-bg-color);
    font-size: 16px;
  }

  #show button {
    border: none;
    /* 666背景颜色叠加问题 */
    background-color: rgba(237, 130, 239, 0);
    /* 666button文字大小继承问题 */
    font-size: inherit;
  }

  #show .content ul {
    list-style: none;
    display: flex;
    justify-content: space-around;
    margin: 5px;
    padding: 5px;
    border: 1.4px solid violet;

  }

  #show .content ul li {
    width: 100px;
    text-align: center;
    display: flex;
    justify-content: space-around;
  }
</style>

<body>

  <!-- <button id="get">get请求</button> -->
  <!-- 已知问题:进行post和delete请求后无法阻止页面刷新 -->
  <div id="bd">
    <div class="add">
      <h3>录入数据</h3>
      <input type="text" placeholder="姓名" class="uname">
      <input type="text" placeholder="年龄" class="age">

      <button id="post">post请求</button>
    </div>

    <div class="login">
      <h3>登入检测</h3>
      <input type="text" placeholder="姓名" class="uname">
      <input type="text" placeholder="年龄" class="age">
      <button id="login">登入</button>
    </div>
  </div>
  <!-- <button id="delete">delete请求</button> -->

  <div id="show">
    <h3 style="color: violet;padding: 10px;">数据展示</h3>
    <div class="content">
      <ul style="background-color: rgba(237, 130, 239, .3);">
        <li>id</li>
        <li>姓名</li>
        <li>年龄</li>
        <li>操作</li>
      </ul>
      <!-- 动态渲染数据 -->
      <!-- <ul date-id="">
      <li>id</li>
      <li>姓名</li>
      <li>年龄</li>
      <li>
        <button>编辑</button>
        <button>删除</button>
      </li>
    </ul> -->
    </div>

  </div>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script> -->
  <!-- bootstrap弹框 -->
  <script>

    // 前端仅需考虑页面的渲染和传输一些基本数据，对数据的操作和处理在后端完成


    const RenderDate = () => {
      const content = document.querySelector('#show .content')
      content.innerHTML = `
      <ul style="background-color: rgba(237, 130, 239, .3);">
      <li>id</li>
      <li>姓名</li>
      <li>年龄</li>
      <li>操作</li></ul>`

      axios.get('http://localhost:3000/save-data')
        .then(res => {
          res.data.users.forEach(({ id, uname, age }) => {
            const render = document.createElement('ul')
            content.appendChild(render)
            render.dataset.id = id  //自定义id 定位数据与动态渲染

            console.log(id, uname, age);
            //请告诉我为什么不log会报错

            [id, uname, age].forEach(item => {
              const element = document.createElement('li')
              element.textContent = item
              render.appendChild(element)
            })

            //自定义样式选择器
            const li = document.createElement('li')
            // console.log(document.querySelector(`[data-id="${id}"]`));
            // 自定义样式的css选择方式
            document.querySelector(`[data-id="${id}"]`).appendChild(li)

            // edit按钮
            const edit = document.createElement('button')
            edit.textContent = '编辑'
            edit.style.color = 'skyblue'
            edit.addEventListener('click', () => editbutton(id))
            li.appendChild(edit)

            //delete按钮
            const deletes = document.createElement('button')
            deletes.textContent = '删除'
            deletes.style.color = '#DD6B4F'
            deletes.addEventListener('click', () => deletebutton(id))
            li.appendChild(deletes)
          })
        })
        .catch(err => console.log(err.message))
    }

    document.addEventListener("DOMContentLoaded", RenderDate)

    //编辑按钮
    const editbutton = id => {
      axios.post('http://localhost:3000/edit', { id })
        .then(res => {
          const { id, uname, age } = res.data
          //弹出编辑框
        })
        .catch(err => console.log(err.message))


    }

    //删除按钮
    const deletebutton = id => {
      axios.delete(`http://localhost:3000/delete/${id}`)
        .then(res => {
          console.log('删除成功', res.data);

          RenderDate()
        })
        .catch(err => console.log(err.message))

    }


    // 创建结果函数
    const CreateResult = (text, color, id) => {
      const result = document.getElementById(`${id}`).appendChild(document.createElement('div'))
      result.className = 'result'
      result.style.backgroundColor = color
      result.textContent = text
      setTimeout(() => {
        result.remove()
      }, 2000)
    }

    /*
    document.getElementById('get').addEventListener('click', function(e) {
        e.preventDefault()
    
        axios.get('http://localhost:3000/save-data')
        .then(res => console.log('读取成功:', res.data))
        .catch(err => console.error('读取失败:', err.response.data));
    })
    */

    document.getElementById('post').addEventListener('click', function (e) {
      e.preventDefault()
      const uname = document.querySelector('.add .uname')
      const age = document.querySelector('.add .age')
      // 检验输入
      if (uname.value === '' || age.value === '') {
        CreateResult('请输入完整信息！', 'red', 'post')
        return  //截断
      }

      axios.post('http://localhost:3000/save-data', { // 替换为后端接口地址
        uname: uname.value,
        age: age.value
      })
        .then(res => {
          console.log('写入成功:', res.data)
          // 请先解决post成功后，页面自动刷新问题
          //已解决，livesever监测到更改后，刷新问题
          RenderDate()
          uname.value = ''
          age.value = ''
        })
        .catch(err => {
          console.error('写入失败:', err)
        });

    });

    document.getElementById('login').addEventListener('click', function (e) {
      e.preventDefault()
      const uname = document.querySelector('.login .uname')
      const age = document.querySelector('.login .age')
      //
      if (uname.value === '' || age.value === '') {
        CreateResult('请输入完整信息！', 'red', 'login')
        return //
      }

      axios.get('http://localhost:3000/save-data')
        .then(res => {

          let flag = false
          const users = res.data.users

          // console.log(uname.value);
          // console.log(age.value);

          users.forEach(item => {
            if (item.uname === uname.value && item.age === age.value) {
              flag = true
            }
          })

          if (flag) {
            CreateResult('登入成功', 'green', 'login')
          } else {
            CreateResult('登入失败', 'red', 'login')
            //注意同步异步操作(清空操作放置位置)
            uname.value = ''
            age.value = ''
          }

        })
        .catch(err => {
          console.error('读取失败:', err)
          CreateResult('读取失败', 'red', 'login')
        })

    })


    /*
    document.getElementById('delete').addEventListener('click', function(e) {
      e.preventDefault();
    
      axios.delete('http://localhost:3000/save-data')
        .then(response => {
          console.log(response.data.message); // 输出: "文件已删除"
          CreateResult('数据删除成功','green','delete')
        })
        .catch(error => {
          console.error('删除失败:', error.response?.data?.error || error.message);
          CreateResult('数据删除失败','red','delete')
        });
    });
    */



    // http请求报文和响应报文
    // 请求报文:
    // 请求行: 请求方法 请求地址 请求协议/版本
    // 请求头: 请求头名称: 请求头值
    // 请求体: 请求体名称: 请求体值
    // 响应报文:
    // 响应行: 响应协议/版本 响应状态码 响应状态消息
    // 响应头: 响应头名称: 响应头值
    // 响应体: 响应体名称: 响应体值

  </script>
</body>

</html>
