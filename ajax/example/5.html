<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
  </head>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    .imgContent {
      width: 500px;
      height: 300px;
      display: none;
    }

    .button1,
    .button2 {
      height: 30px;
      width: 50px;
    }
  </style>

  <body>
    <!-- accept限制接受格式 -->
    <input type="file" id="img" accept="image/*,.jpg,.png,.gif,.pdf" />

    <img src="" alt="" class="imgContent" />
    <br />
    <input type="checkbox" class="button1" />
    <br />
    <input type="checkbox" class="button2" />
    <br />
    <div class="cityContent"></div>
  </body>
  <script>
    document.getElementById('img').addEventListener('change', (event) => {
      // console.log(e);
      // 打印e.target不显示
      // console.log(e.target.files[0]);
      const fd = new FormData();
      fd.append('img', event.target.files[0]);
      // console.log(fd);

      const reader = new FileReader(); // 创建 FileReader 对象

      // 当文件读取完成时触发
      reader.onload = function (e) {
        const Image = document.querySelector('.imgContent');
        Image.src = e.target.result; // 设置图片的 src 为读取结果
        Image.style.display = 'block'; // 显示图片
      };

      reader.readAsDataURL(event.target.files[0]);
    });
    (function () {
      // 1.创建xhr对象
      // 2.设置请求方式和请求地址 xhr.open(请求方式, 请求地址, [是否异步])
      // 3.监听请求状态 xhr.addEventListner('loadend', function () {
      //   if (xhr.readyState === 4 && xhr.status === 200) {
      //     处理请求结果
      //     console.log(xhr.responseText);
      //   }
      // })
      // 4.发送请求 xhr.send(请求体)
      // const API_URL = 'http://localhost:3000';

      const xhr = new XMLHttpRequest();

      // xhr.open('get', `${API_URL}/xhr`);
      xhr.open('get', 'http://hmajax.itheima.net/api/province');

      xhr.addEventListener('loadend', function () {
        document
          .querySelector('.button1')
          .addEventListener('click', function () {
            console.log(xhr.response);
            // xhr.response.message  xhr.response.list
            // JSON.stringify()  JSON.parse()

            const data = JSON.parse(xhr.response);
          });
      });

      xhr.send();
    })();

    (function () {
      //xhr携带查询参数
      const API_URL = 'http://hmajax.itheima.net/api/city?pname=河南省';
      const xhr = new XMLHttpRequest();

      xhr.open('get', API_URL);

      xhr.addEventListener('loadend', function () {
        document
          .querySelector('.button2')
          .addEventListener('click', function () {
            const data = JSON.parse(xhr.response);
            console.log(data.list);
            // 将data.list数组中的每个元素拼接成一个字符串
            const str = data.list.join(',');
            // 将字符串写入到页面中
            document.querySelector('.cityContent').innerHTML = str;
          });
      });

      //设置
      xhr.setRequestHeader('Content-Type', 'application/json');

      const obj = {
        name: 'huwenqi',
        age: 18,
      };
      //将普通字符串对象转换为查询字符串对象
      const paramsObj = new URLSearchParams(obj);
      console.log(paramsObj);
      // 将paramsObj对象转换为字符串
      const paramsStr = paramsObj.toString();
      console.log(paramsStr);

      const paramsJson = JSON.stringify(obj);
      console.log(paramsJson);

      xhr.send(paramsJson);
    })();

    (function () {
      // 用promise和xhr获取省份列表
      const p = new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();

        xhr.open('GET', 'http://hmajax.itheima.net/api/province');
        // xhr.open('GET', 'http://hmajax.itheima.net/api/province123');
        // 访问路径错误,返回对应状态码
        xhr.addEventListener('loadend', function () {
          if (xhr.status >= 200 && xhr.status < 300) {
            resolve(xhr.response);
          } else {
            reject(new Error(xhr.response));
          }
        });

        xhr.send();
      });

      const content = document.querySelector('.cityContent');
      //用promise对网络访问得到的资源进行同一处理
      // 链式调用  <=>  对象方法调用后返回this对象本身
      p.then((result) => {
        content.innerHTML = JSON.parse(result).list.join(',');
      }).catch((err) => {
        content.innerHTML = err;
      });
    })();

    (function () {
      // 手动封装简易axios
      class Axios {
        constructor(config) {}

        getParamsStr(p) {
          const paramsObj = new URLSearchParams(p);
          return paramsObj.toString();
        }

        request(config) {
          return new Promise((resolve, reject) => {
            let { method, url, params } = config;

            const xhr = new XMLHttpRequest();
            if (params) {
              url += '?' + this.getParamsStr(params);
            }

            xhr.open(method, url);

            xhr.onloadend = () => {
              if (xhr.status >= 200 && xhr.status < 300) {
                resolve(xhr.response);
              } else {
                reject(new Error(`HTTP error! status: ${xhr.status}`));
              }
            };

            xhr.send();
          });
        }

        //类似与axios的方法
        //get查询,post提交.所以第二个参数设置符合
        get(url, config = {}) {
          return this.request({ ...config, method: 'get', url });
        }
        post(url, data = {}, config = {}) {
          //data位置妙
          return this.request({ ...config, method: 'get', url, data });
        }
      }
      const myAxios = new Axios();
      //then 和 catch 是Promise 中的方法
      myAxios
        .get('http://hmajax.itheima.net/api/province')
        .then((res) => console.log('基础get请求:', res))
        .catch((err) => console.log('基础get请求:', err));

      myAxios
        .get('http://hmajax.itheima.net/api/area', {
          params: {
            pname: '河南省',
            cname: '信阳市',
          },
        })
        .then((res) => console.log('查询参数:', res))
        .catch((req) => console.log('查询参数:', req));

      myAxios
        .post('http://hmajax.itheima.net/api/register', {
          username: 'itheima999',
          password: '666666',
        })
        .then((res) => console.log('post请求:', res))
        .catch((err) => console.log('post请求:', err));
    })();
  </script>
</html>
