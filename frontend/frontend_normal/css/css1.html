<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html导入CSS</title>
    <link rel="stylesheet" href="example.CSS">
    <style>
        h2{
            color: #9d6994;
            background-color: aqua;
        }
        #ex{
            font-size: 50px;
            width: 200px;
            height: 70px;
        }
        *{
            font-family:'kaiti'
        }
        #frist:hover{
            color: crimson;
        }
    </style>
    <!-- class->.   id->#  -->
    <!-- *作用于所有 -->
</head>
<body>
    <p id="frist">
        使用了CSS
    </p>
    <h1 style="color: rgb(152, 188, 85);">
        内联样式
    </h1>
    <h2 id="ex" style="font:'kaiti' ;">
        内部样式
    </h2> 
</body>
</html>
