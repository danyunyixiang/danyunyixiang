<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 初始化样式 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/reset.css@2.0.2/reset.min.css"
    />
    <!-- 引入bootstrap.css -->
    <link
      href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.2.3/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- 核心样式 -->
    <style>
      .container {
        width: 1000px;
        padding-top: 20px;
        margin: 0 auto 0;
        position: relative;
      }

      .container .stu-title {
        font-weight: 900;
        font-size: 36px;
      }

      .container .bg {
        display: block;
        width: 100%;
      }

      .item-wrap .hot-area {
        display: flex;
        margin-bottom: 20px;
      }

      .item-wrap .hot-area .hot {
        color: #c32f32;
        font-weight: 600;
        margin-right: 20px;
      }

      .item-wrap .nav {
        display: flex;
      }

      .item-wrap .nav li {
        margin-right: 10px;
      }

      .item-wrap .nav li a {
        text-decoration: none;
        color: black;
      }

      .item-wrap .title {
        font-weight: 600;
        white-space: nowrap;
        margin-right: 20px;
      }

      .item-wrap select {
        width: 150px;
        height: 40px;
        font-size: 14px;
        color: black;
        letter-spacing: 0;
        font-weight: 400;
        background: #ffffff;
        border: 1px solid rgba(232, 232, 233, 1);
        border-radius: 4px;
        padding: 10px;
        outline: none;
        margin-right: 10px;
      }

      .item-wrap select option {
        font-weight: normal;
        display: block;
        white-space: nowrap;
        min-height: 1.2em;
        padding: 0px 2px 1px;
        font-size: 16px;
      }

      .item-wrap input {
        font-weight: normal;
        display: block;
        white-space: nowrap;
        min-height: 1.2em;
        padding: 0px 2px 1px;
        height: 40px;
        font-size: 16px;
        border: 1px solid rgba(232, 232, 233, 0.682);
        color: black;
      }

      .item-wrap .feedback {
        width: 400px;
        height: 150px;
        border: 1px solid rgba(232, 232, 233, 0.682);
      }

      .item-wrap .area-box {
        margin-bottom: 20px;
        display: flex;
        align-items: center;
      }
    </style>
    <title>学习反馈</title>
  </head>

  <body>
    <div class="container">
      <h4 class="stu-title">学习反馈</h4>
      <div class="item-wrap">
        <div class="hot-area">
          <span class="hot">热门校区</span>
          <ul class="nav">
            <li><a target="_blank" href="http://bjcp.itheima.com/">北京</a></li>
            <li><a target="_blank" href="http://sh.itheima.com/">上海</a></li>
            <li><a target="_blank" href="http://gz.itheima.com/">广州</a></li>
            <li><a target="_blank" href="http://sz.itheima.com/">深圳</a></li>
          </ul>
        </div>
        <form class="info-form">
          <div class="area-box">
            <span class="title">地区选择</span>
            <select name="province" class="province">
              <option value="">省份</option>
            </select>
            <select name="city" class="city">
              <option value="">城市</option>
            </select>
            <select name="area" class="area">
              <option value="">地区</option>
            </select>
          </div>
          <div class="area-box">
            <span class="title">您的称呼</span>
            <input type="text" name="nickname" class="nickname" value="播仔" />
          </div>
          <div class="area-box">
            <span class="title">宝贵建议</span>
            <textarea
              type="text"
              name="feedback"
              class="feedback"
              placeholder="您对AJAX阶段课程宝贵的建议"
            ></textarea>
          </div>
          <div class="area-box">
            <button type="button" class="btn btn-secondary submit">
              确定提交
            </button>
          </div>
        </form>
      </div>
    </div>
    <script src="https://cdn.bootcdn.net/ajax/libs/axios/1.2.0/axios.min.js"></script>

    const render = (place, str, res) => {
      // console.log(res.data);
      const placeHtml = `<option value="">${str}</option>`;

      place.innerHTML =
        placeHtml +
        res.data.list
          .map((item) => `<option value="${item}">${item}</option>`)
          .join('');
    };
    //调用

    document.querySelector('.submit').addEventListener('click', function () {
      const nickname = document.querySelector('.nickname').value;
      const feedback = document.querySelector('.feedback').value;
      let index = 0;
      const newarr = [...positonArr, '称呼', '建议'];
      for (const item of [pname, cname, aname, nickname, feedback]) {
        if (item === '') {
          alert(`请填写${newarr[index]}`);

        }
        index++;
      }

        province: pname,
        city: cname,
        area: aname,
        nickname,
        feedback,
      };
      axios
        .post('http://hmajax.itheima.net/api/feedback', data)
        .then((res) => {
          console.log(res);
        })
        .catch((err) => {
          console.error(err);
        });
    });
